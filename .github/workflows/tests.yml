# Terminal Widget - tests on real Windows (PowerShell 5.1 and 7)
# Put this file at .github/workflows/tests.yml in the repository; the widget
# files are expected in the repository root.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pester:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # powershell = Windows PowerShell 5.1 (the launcher's host)
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse check (catches syntax the host does not know, e.g. ?? in 5.1)
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1 -Recurse) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): $bad parse error(s)"
          if ($bad -gt 0) { exit 1 }

      - name: Encoding check (UTF-8 with BOM, needed by Windows PowerShell 5.1)
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1 -Recurse) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              Write-Host "::error file=$($f.Name)::missing UTF-8 BOM"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Install Pester 5
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester
        env:
          TW_RUN_UI_SMOKE: "1"
          TW_SMOKE_SHOTS: ${{ github.workspace }}\shots
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.\TerminalWidget.Core.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults-${{ matrix.shell }}.xml'
          Invoke-Pester -Configuration $cfg

      - name: Screenshot report and contact sheet
        if: always()
        continue-on-error: true
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Add-Type -AssemblyName System.Drawing
          $files = @(Get-ChildItem shots -Filter *.png | Where-Object { $_.Name -ne '_contact-sheet.png' } | Sort-Object Name)
          if ($files.Count -eq 0) { exit 0 }
          # report only (no failing): compares with docs/shots-baseline-<shell>.json if that file exists
          $baseFile = 'docs/shots-baseline-${{ matrix.shell }}.json'
          $base = @{}
          if (Test-Path $baseFile) { (Get-Content $baseFile -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $base[$_.Name] = [string]$_.Value } }
          $now = [ordered]@{}
          $lines = @('### Screenshots (${{ matrix.shell }})', '', '| Image | Status |', '|---|---|')
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.Substring(0, 16)
            $now[$f.Name] = $h
            $st = 'no baseline'
            if ($base.Count -gt 0) { if (-not $base.ContainsKey($f.Name)) { $st = 'new' } elseif ($base[$f.Name] -ne $h) { $st = 'changed' } else { $st = 'same' } }
            $lines += ('| {0} | {1} |' -f $f.Name, $st)
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          ($now | ConvertTo-Json) | Set-Content 'shots/_hashes.json' -Encoding UTF8
          # contact sheet: all images side by side
          $tw = 360; $th = 250; $cols = 4
          $rowsN = [int][math]::Ceiling($files.Count / $cols)
          $bmp = New-Object System.Drawing.Bitmap ([int]($cols * $tw)), ([int]($rowsN * $th))
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(24, 24, 27))
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $font = New-Object System.Drawing.Font('Segoe UI', 8)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(200, 200, 205))
          $i = 0
          foreach ($f in $files) {
            try {
              $im = [System.Drawing.Image]::FromFile($f.FullName)
              $s = [math]::Min(($tw - 8) / $im.Width, ($th - 24) / $im.Height)
              $x = ($i % $cols) * $tw + 4
              $y = [int][math]::Floor($i / $cols) * $th + 4
              $g.DrawImage($im, [int]$x, [int]$y, [int]($im.Width * $s), [int]($im.Height * $s))
              $g.DrawString($f.BaseName, $font, $brush, [single]$x, [single]($y + $th - 20))
              $im.Dispose()
            } catch { }
            $i++
          }
          $bmp.Save((Join-Path (Get-Location) 'shots/_contact-sheet.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()

      - name: Upload screenshots of the UI smoke test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ matrix.shell }}
          path: shots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shell }}
          path: testResults-${{ matrix.shell }}.xml

      - name: PSScriptAnalyzer (errors only, informational)
        if: matrix.shell == 'pwsh'
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error | Format-Table -AutoSize | Out-String -Width 220
